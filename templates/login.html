{% extends "base.html" %}

{% block title %}Sign In — NutriScan AI{% endblock %}

{% block content %}
<div class="container" style="max-width: 460px; margin: 2rem auto;">
    <div class="card" style="box-shadow: 0 10px 40px rgba(0,0,0,0.5);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-icon" style="margin: 0 auto 1rem; width: 50px; height: 50px; font-size: 1.5rem;">🥗</div>
            <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;">Welcome Back</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to access your personal nutrition dashboard</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login_page') }}">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" value="{{ email or '' }}" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
                Sign In to Dashboard
            </button>
        </form>

        <div style="margin-top: 1.75rem; text-align: center; border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
            <p style="color: var(--text-muted); font-size: 0.9rem;">
                Don't have an account yet? 
                <a href="{{ url_for('auth.register_page') }}" style="font-weight: 600;">Create an account</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
